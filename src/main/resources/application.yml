server:
  port: 8080

spring:
  application:
    name: payments-api
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=cop-testDB;encrypt=true;trustServerCertificate=true}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2s
          max-attempts: 3

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-prod-min-32-characters-long}
    expiration-minutes: 60
  logging:
    loki-url: ${LOKI_URL:http://localhost:3100/loki/api/v1/push}

management:
  endpoints:
    web:
      exposure:
        include: health,info
